name = "hitapi-worker"
main = "src/index.js"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database (replaceable via adapter) ───────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "hitapi-db"
database_id = "YOUR_D1_DATABASE_ID"

# ─── KV Namespace (cache layer) ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

# ─── Queue (async test execution) ────────────────────────────────────────────
[[queues.producers]]
queue = "hitapi-test-queue"
binding = "TEST_QUEUE"

[[queues.consumers]]
queue = "hitapi-test-queue"
max_batch_size = 10
max_batch_timeout = 5

# ─── R2 Bucket (report storage) ──────────────────────────────────────────────
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "hitapi-reports"

# ─── AI binding ──────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ─── Environment variables ───────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "*"

# ─── Local dev: override vars in .dev.vars (gitignored) ─────────────────────
# Create worker/.dev.vars with:
#   ENVIRONMENT=development
#   CORS_ORIGIN=http://localhost:5173
# Wrangler picks this up automatically for `wrangler dev`.