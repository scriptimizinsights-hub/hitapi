name = "hitapi-service"
main = "src/index.js"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database (replaceable via adapter) ───────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "hitapi-db"
database_id = "914c8f2f-58e5-4bbe-bd33-a37168aea3b8"

# ─── KV Namespace (cache layer) ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "8a637407d80a470cb24c2201ab3a6047"

# ─── Queue (async test execution) ────────────────────────────────────────────
[[queues.producers]]
queue = "hitapi-test-queue"
binding = "hitapi-test-queue"

[[queues.consumers]]
queue = "hitapi-test-queue"
max_batch_size = 10
max_batch_timeout = 5

# ─── R2 Bucket (report storage) ──────────────────────────────────────────────
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "apiforge-reports"

# ─── AI binding ──────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ─── Environment variables ───────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
VITE_API_URL="https://services.hitapi.dev/api"
CORS_ORIGIN = "*"

# ─── Local dev overrides ─────────────────────────────────────────────────────
[env.development]
[env.development.vars]
ENVIRONMENT = "development"
CORS_ORIGIN = "http://localhost:5173"
